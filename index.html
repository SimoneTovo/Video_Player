<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Player</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  #drop{width:min(94vw,1200px);padding:20px;border:2px dashed #666;border-radius:14px;text-align:center}
  #drop.drag{border-color:#ddd;background:#222}
  video{display:none;width:min(94vw,1200px);max-height:78vh;background:#000;border-radius:10px}
  #buttons{display:none;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;padding:10px 15px;min-width:62px;border-radius:9px;border:1px solid #555;background:#222;color:#eee;cursor:pointer}
  button:hover{background:#333}
  #fullscreen{margin-left:8px;min-width:135px}
  .hint{font-size:13px;color:#aaa;text-align:center;line-height:1.7}
  .key{color:#eee;font-weight:600}
</style>
</head>
<body>

<div id="drop">
  Trascina qui il video oppure
  <button id="pick" type="button">Scegli video</button>
  <input id="file" type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv" hidden>
</div>

<video id="video" controls playsinline></video>

<div id="buttons">
  <button type="button" data-skip="-10">−10 s</button>
  <button type="button" data-skip="-5">−5 s</button>
  <button type="button" data-skip="-1">−1 s</button>
  <button type="button" id="play">▶ / ❚❚</button>
  <button type="button" data-skip="1">+1 s</button>
  <button type="button" data-skip="5">+5 s</button>
  <button type="button" data-skip="10">+10 s</button>
  <button type="button" id="fullscreen">⛶ Schermo intero</button>
</div>

<div class="hint">
  <span class="key">← / →</span> = 10s &nbsp; • &nbsp;
  <span class="key">5 + ← / →</span> = 5s &nbsp; • &nbsp;
  <span class="key">1 + ← / →</span> = 1s
  <br>
  <span class="key">Spazio</span> = Play/Pausa &nbsp; • &nbsp;
  <span class="key">F</span> = Schermo intero
</div>

<script>
const v = document.getElementById('video');
const drop = document.getElementById('drop');
const file = document.getElementById('file');
const buttons = document.getElementById('buttons');

document.getElementById('pick').addEventListener('click', () => file.click());

function skip(seconds) {
  if (!v.src) return;
  const duration = Number.isFinite(v.duration) ? v.duration : Infinity;
  v.currentTime = Math.max(0, Math.min(duration, v.currentTime + seconds));
}

function togglePlay() {
  if (!v.src) return;
  v.paused ? v.play().catch(()=>{}) : v.pause();
}

async function goFullscreen() {
  if (!v.src) return;
  try {
    if (!document.fullscreenElement) {
      if (v.requestFullscreen) await v.requestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch(e) {}
}

document.querySelectorAll('[data-skip]').forEach(btn => {
  btn.addEventListener('click', () => skip(Number(btn.dataset.skip)));
});

document.getElementById('play').addEventListener('click', togglePlay);
document.getElementById('fullscreen').addEventListener('click', goFullscreen);

function loadVideo(f) {
  if (!f) return;
  if (v.src) URL.revokeObjectURL(v.src);
  v.src = URL.createObjectURL(f);
  v.style.display = 'block';
  buttons.style.display = 'flex';
  drop.style.display = 'none';
  v.load();
  v.play().catch(()=>{});
}

file.addEventListener('change', () => loadVideo(file.files[0]));

['dragenter','dragover'].forEach(name => drop.addEventListener(name, e => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave','drop'].forEach(name => drop.addEventListener(name, e => {
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop', e => loadVideo(e.dataTransfer.files[0]));

let jumpModifier = null;
const heldJumpKeys = new Set();

document.addEventListener('keydown', e => {
  if (!v.src) return;

  if (e.key === '1' || e.key === '5') {
    jumpModifier = Number(e.key);
    heldJumpKeys.add(e.key);
    e.preventDefault();
    return;
  }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();

    const step = jumpModifier === 1 ? 1 : jumpModifier === 5 ? 5 : 10;
    const t = v.currentTime;
    const eps = 0.0001;
    let target;

    if (e.key === 'ArrowLeft') {
      // Vai sempre alla tacca precedente.
      // Esempio: 97.30 s -> 90 s (step 10), 95 s (step 5), 97 s (step 1).
      target = Math.floor((t - eps) / step) * step;
    } else {
      // Vai sempre alla tacca successiva.
      target = Math.ceil((t + eps) / step) * step;
    }

    const duration = Number.isFinite(v.duration) ? v.duration : Infinity;
    v.currentTime = Math.max(0, Math.min(duration, target));
  } else if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.key.toLowerCase() === 'f') {
    e.preventDefault();
    goFullscreen();
  }
});

document.addEventListener('keyup', e => {
  if (e.key === '1' || e.key === '5') {
    heldJumpKeys.delete(e.key);
    if (heldJumpKeys.has('1')) jumpModifier = 1;
    else if (heldJumpKeys.has('5')) jumpModifier = 5;
    else jumpModifier = null;
    e.preventDefault();
  }
});
</script>
</body>
</html>
